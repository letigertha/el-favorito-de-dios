name: Aplicar V17 preguntas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-v17.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar preguntas V17 e insertarlas
        env:
          PAYLOAD: ''
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64, gzip
          js = gzip.decompress(base64.b64decode(os.environ["PAYLOAD"])).decode("utf-8")
          Path("extra_questions_v17.js").write_text(js, encoding="utf-8")
          p = Path("index.html")
          text = p.read_text(encoding="utf-8")
          tag = '<script src="./extra_questions_v17.js?v=17"></script>'
          if tag not in text:
              text = text.replace("</body></html>", tag + "\n</body></html>")
              p.write_text(text, encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html extra_questions_v17.js
          git diff --cached --quiet || git commit -m "Amplía a 25 preguntas por eneatipo"
          git push
