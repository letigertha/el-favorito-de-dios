name: Aplicar V16

on:
  push:
    paths:
      - '.github/workflows/apply-v16.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar cambios V16
        run: python scripts/apply_v16.py

      - name: Commit y push
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios pendientes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Añade Cartas Guardadas a la miniweb"
          git push
